{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherGIS Platform</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #fff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        .page-header {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #fff;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .brand-container h1 { margin: 0; font-size: 1.3rem; }
        
        .nav-menu { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { 
            color: rgba(255,255,255,0.85); 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-menu a:hover, .nav-menu a.active { color: #fff; }

        .auth-links { display: flex; align-items: center; gap: 1rem; }
        .btn-login { color: #fff; text-decoration: none; font-size: 0.85rem; }
        .btn-signup { 
            background: #fff; color: var(--primary); 
            padding: 0.4rem 1rem; border-radius: 6px; 
            text-decoration: none; font-weight: 600; font-size: 0.85rem;
        }

        /* --- LAYOUT --- */
        .gis-container { display: flex; flex: 1; overflow: hidden; padding: 1rem; gap: 1rem; }

        .sidebar {
            width: 320px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .sidebar h2 { font-size: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; }

        #location-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        #location-list li {
            background: var(--bg);
            margin-bottom: 0.6rem;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        #location-list li:hover { border-color: var(--primary); transform: translateX(4px); background: #fff; }
        .loc-name { font-weight: 600; font-size: 0.9rem; display: block; }
        .coords { font-size: 0.75rem; color: var(--text-muted); }

        .map-main { flex: 1; background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
        #map { height: 100%; width: 100%; }

        /* Save Button in Popup */
        .btn-save-here {
            background: var(--primary); color: white; border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
            margin-top: 8px; width: 100%; font-weight: 600;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <div class="brand-container">
            <h1>WeatherGIS</h1>
        </div>
        
        <nav>
            <ul class="nav-menu">
                <li><a href="/" class="active">Map</a></li>
                <li><a href="/forecast">Forecast</a></li>
                <li><a href="/compare">Compare</a></li>
                <li><a href="/route">Route</a></li>
                <li><a href="/layers">Layers</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>

        <div class="auth-links">
            <a href="#" class="btn-login">Login</a>
            <a href="#" class="btn-signup">Sign Up</a>
        </div>
    </header>

    <div class="gis-container">
        <aside class="sidebar">
            <h2>Saved Locations 📍</h2>
            <ul id="location-list">
                </ul>
        </aside>

        <main class="map-main">
            <div id="map"></div>
        </main>
    </div>

    <script id="initial-locations-data" type="application/json">
        {{ locations|json_script:"initial-locations-data" }}
    </script>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        (function() {
            'use strict';

            const App = {
                map: null,
                markers: new Map(),
                
                init() {
                    this.initMap();
                    this.loadData();
                    this.bindEvents();
                },

                initMap() {
                    this.map = L.map('map').setView([21.0285, 105.8542], 6);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
                },

                loadData() {
                    const dataEl = document.getElementById('initial-locations-data');
                    let locations = [];
                    
                    try {
                        // Thử lấy dữ liệu từ Django
                        const rawData = JSON.parse(dataEl.textContent);
                        locations = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                    } catch (e) {
                        // Dữ liệu giả nếu lỗi hoặc trống
                        locations = [
                            {id: 'fake1', name: 'Hanoi Capital', latitude: 21.0285, longitude: 105.8542},
                            {id: 'fake2', name: 'Da Nang City', latitude: 16.0471, longitude: 108.2067}
                        ];
                    }

                    if (!locations || locations.length === 0) {
                        locations = [{id: 'temp1', name: 'Example Point', latitude: 21.0, longitude: 105.8}];
                    }

                    locations.forEach(loc => this.renderLocation(loc));
                },

                renderLocation(loc) {
                    // Add Marker
                    const marker = L.marker([loc.latitude, loc.longitude]).addTo(this.map);
                    marker.bindPopup(`<b>${loc.name}</b><br><small>${loc.latitude.toFixed(3)}, ${loc.longitude.toFixed(3)}</small>`);
                    this.markers.set(String(loc.id), marker);

                    // Add to Sidebar
                    const list = document.getElementById('location-list');
                    const li = document.createElement('li');
                    li.dataset.id = loc.id;
                    li.innerHTML = `
                        <span class="loc-name">${loc.name}</span>
                        <span class="coords">${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}</span>
                    `;
                    list.prepend(li); // Hiện mới nhất lên đầu
                },

                bindEvents() {
                    // Click Sidebar để di chuyển map
                    document.getElementById('location-list').addEventListener('click', (e) => {
                        const li = e.target.closest('li');
                        if (!li) return;
                        const marker = this.markers.get(li.dataset.id);
                        if (marker) {
                            this.map.flyTo(marker.getLatLng(), 12);
                            marker.openPopup();
                        }
                    });

                    // Click Map để hiện nút Save
                    this.map.on('click', (e) => {
                        const { lat, lng } = e.latlng;
                        const popupContent = document.createElement('div');
                        popupContent.innerHTML = `
                            <strong>New Location</strong><br>
                            <input type="text" id="new-loc-name" placeholder="Name this place..." style="width:100%; margin-top:5px; padding:4px;">
                            <button class="btn-save-here" id="btn-save-action">Save to Sidebar</button>
                        `;

                        L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(this.map);

                        // Xử lý lưu khi bấm nút trong popup
                        setTimeout(() => {
                            document.getElementById('btn-save-action').onclick = () => {
                                const name = document.getElementById('new-loc-name').value || "Saved Point";
                                this.saveLocationToServer(lat, lng, name);
                            };
                        }, 10);
                    });
                },

                async saveLocationToServer(lat, lng, name) {
                    // 1. Hiển thị ngay lập tức lên UI (Optimistic UI)
                    const tempId = Date.now();
                    const newLoc = { id: tempId, name: name, latitude: lat, longitude: lng };
                    this.renderLocation(newLoc);
                    this.map.closePopup();

                    // 2. Gửi dữ liệu thật về Django (POST request)
                    try {
                        const response = await fetch(window.location.href, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': this.getCookie('csrftoken')
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lng,
                                name: name
                            })
                        });

                        if (!response.ok) throw new Error("Failed to save");
                        console.log("Saved successfully!");
                    } catch (err) {
                        console.error("Save error:", err);
                        alert("Could not save to database, but it's added to your current view.");
                    }
                },

                getCookie(name) {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i].trim();
                            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }
            };

            document.addEventListener('DOMContentLoaded', () => App.init());
        })();
    </script>
</body>
</html>
