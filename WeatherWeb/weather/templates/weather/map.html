{% extends 'base.html' %}
{% load static %}

{% block title %}Bản đồ – WeatherGIS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/map.css' %}">
{% endblock %}

{% block content %}
<div class="gis-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Vị trí đã lưu</h2>
            <span class="location-count" id="location-count">0</span>
        </div>

        <!-- Group Filter -->
        <div class="filter-section">
            <select id="group-filter" class="form-control">
                <option value="">Tất cả vị trí</option>
                {% for group in groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Location List -->
        <div class="sidebar-content">
            <ul class="location-list" id="location-list">
                <!-- Populated by JS -->
            </ul>
        </div>

        <!-- Quick Add Form -->
        <div class="quick-add-section">
            <h3>Thêm nhanh</h3>
            <form id="quick-add-form">
                <div class="form-row">
                    <input type="number" step="0.0001" id="input-lat" class="form-control" placeholder="Vĩ độ">
                    <input type="number" step="0.0001" id="input-lng" class="form-control" placeholder="Kinh độ">
                </div>
                <input type="text" id="input-name" class="form-control" placeholder="Tên vị trí (tùy chọn)">
                <button type="submit" class="btn btn-primary btn-block">Thêm vị trí</button>
            </form>
        </div>
    </aside>

    <!-- Map Container -->
    <div class="map-container">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block page_data %}
<script id="initial-data" type="application/json">
{
    "locations": {{ locations_json|safe }},
    "groups": {{ groups_json|safe }},
    "isAuthenticated": {{ is_authenticated|yesno:"true,false" }}
}
</script>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/pages/map.js' %}"></script>
{% endblock %}
