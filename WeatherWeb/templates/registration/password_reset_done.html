{% extends 'base.html' %}
{% load static %}

{% block title %}Đã gửi email - WeatherGIS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Kiểm tra email</h2>
            <p>Nếu email tồn tại trong hệ thống, bạn sẽ nhận được link đặt lại mật khẩu trong ít phút.</p>
        </div>

        <div class="auth-footer">
            <p><a href="{% url 'login' %}">Quay lại đăng nhập</a></p>
        </div>
    </div>
</div>
{% endblock %}
