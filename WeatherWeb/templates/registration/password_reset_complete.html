{% extends 'base.html' %}
{% load static %}

{% block title %}Đổi mật khẩu thành công - WeatherGIS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Đặt lại mật khẩu thành công</h2>
            <p>Mật khẩu đã được cập nhật. Bạn có thể đăng nhập bằng mật khẩu mới.</p>
        </div>

        <div class="auth-footer">
            <p><a href="{% url 'login' %}">Đăng nhập ngay</a></p>
        </div>
    </div>
</div>
{% endblock %}
